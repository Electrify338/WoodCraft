<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoodCraft — Appearance Config</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title">Appearance Config</div>
    <div class="actions">
      <button id="btnScan" title="Re-scan the active design and re-classify every part">Rescan</button>
      <button id="btnBuild" class="primary" title="Create/grow the appearance table from the plan below and fill every cell">Build</button>
      <button id="btnFix" title="Verify an existing table and fill/repair empty or wrong cells (never creates tables)">Verify &amp; Fix</button>
      <button id="btnCheck" title="Read-only sweep: report empty and wrong cells without changing anything">Check</button>
    </div>
  </header>

  <div id="toast" class="toast hidden"></div>

  <div class="bar">
    <span id="docName" class="doc">—</span>
    <span id="tableInfo" class="muted"></span>
    <label class="persist" title="Write your overrides back as WoodCraft role attributes on the components, so the next scan classifies them correctly by itself">
      <input type="checkbox" id="chkPersist" checked> Persist overrides
    </label>
  </div>

  <main id="content">
    <div class="empty">Scanning the active design…</div>
  </main>

  <footer>
    <div class="previewbar">
      <label>Preview row
        <select id="previewRow"></select>
      </label>
      <button id="btnPreview" class="tiny" title="Point the active configuration at this appearance row for a visual check">Preview</button>
      <button id="btnRestore" class="tiny" title="Restore the appearance selection that was active before Preview">Restore</button>
      <span id="footNote" class="path"></span>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
