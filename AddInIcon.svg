<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- WoodCraft add-in icon: an isometric cabinet matching the command-icon
       family. Warm 3-tone shading (top lightest, left side mid, front darkest);
       the front face reads as a cabinet door with a handle. Fills are inlined
       (no CSS classes) so it renders identically in Fusion's SVG engine.
       128x128 with even margins; no text (illegible once scaled to 16px). -->

  <!-- Left face = cabinet side panel (mid yellow) -->
  <polygon points="30,46 64,64 64,100 30,82" fill="#E5C05B"/>

  <!-- Front face = cabinet door (dark yellow) -->
  <polygon points="98,46 64,64 64,100 98,82" fill="#CFA644"/>

  <!-- Top face (light yellow) -->
  <polygon points="64,28 98,46 64,64 30,46" fill="#F3D573"/>

  <!-- Recessed door panel: outline only, darker = reveal/shadow gap -->
  <polygon points="95.3,50.3 66.7,65.4 66.7,95.7 95.3,80.6"
           fill="none" stroke="#A8842F" stroke-width="2" stroke-linejoin="round"/>

  <!-- Door handle near the front edge -->
  <circle cx="70.4" cy="80.5" r="2.3" fill="#5E4A16"/>
</svg>
