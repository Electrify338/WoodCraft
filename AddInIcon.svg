<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .gray-top { fill: #F5F5F5; }
      .gray-left { fill: #D4D4D4; }
      .gray-right { fill: #A3A3A3; }
      
      .yellow-top { fill: #F3D573; }
      .yellow-left { fill: #E5C05B; }
      .yellow-right { fill: #CFA644; }
      
      .text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, sans-serif; font-weight: 700; font-size: 14px; fill: #D4D4D4; letter-spacing: 1px; text-anchor: middle; }
    </style>
  </defs>

  <g transform="translate(64, 55)">
    <!-- Base Gray Block -->
    <polygon class="gray-left" points="0,0 -35,20 -35,45 0,25" />
    <polygon class="gray-right" points="0,0 35,20 35,45 0,25" />
    <polygon class="gray-top" points="0,-20 35,0 0,20 -35,0" />
    
    <!-- Hovering Yellow Block -->
    <g transform="translate(0, -35)">
      <polygon class="yellow-left" points="0,0 -35,20 -35,30 0,10" />
      <polygon class="yellow-right" points="0,0 35,20 35,30 0,10" />
      <polygon class="yellow-top" points="0,-20 35,0 0,20 -35,0" />
    </g>
  </g>
  
  <text x="64" y="118" class="text">WOODCRAFT</text>
</svg>
